# EcoMarket · agente de devoluciones
#
#   docker compose up --build          # Ollama corre en tu máquina (recomendado en Mac)
#   docker compose --profile ollama up # Ollama también en Docker (Linux con GPU o pruebas)
#
# En macOS, Docker no puede usar la GPU de Apple: Ollama dentro de un contenedor sería
# lento (solo CPU). Por eso, por defecto, la app usa el Ollama nativo de tu Mac a través
# de host.docker.internal.

name: ecomarket-agente

x-app: &app
  build: .
  image: ecomarket-agente:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
  extra_hosts:
    - "host.docker.internal:host-gateway"   # necesario en Linux; en Mac/Windows ya existe

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.18.0}
    ports:
      - "6333:6333"
    volumes:
      - qdrant_datos:/qdrant/storage
    healthcheck:
      # La imagen oficial no trae curl: se comprueba que el puerto acepte conexiones.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  indexador:
    <<: *app
    command: ["python", "indexar.py", "--si-no-existe"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    ports:
      - "${PUERTO:-7860}:7860"
    volumes:
      - ejecucion:/app/var          # registro de acciones, etiquetas y memoria del agente
    depends_on:
      qdrant:
        condition: service_healthy
      indexador:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_modelos:/root/.ollama

volumes:
  qdrant_datos:
  ejecucion:
  ollama_modelos:
